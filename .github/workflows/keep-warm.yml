# Keeps the free-tier Render backend awake so the live demo doesn't pay a
# 30-50s cold-start penalty on the first request. Pings the health endpoint
# on a schedule. (GitHub cron is best-effort and can be delayed several
# minutes; for tighter intervals use an external pinger like UptimeRobot.)
name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes
  workflow_dispatch: {} # allow manual runs

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health
        run: |
          curl -fsS --max-time 60 https://wolf-erp-api.onrender.com/api/health \
            && echo " — backend is awake" \
            || echo "ping failed (backend may be cold-starting)"
